<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0e1016;font-family:'Space Grotesk',system-ui,sans-serif}
  a{color:inherit}
  @keyframes ho-drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.15)}66%{transform:translate(-40px,30px) scale(.92)}100%{transform:translate(0,0) scale(1)}}
  @keyframes ho-drift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.2)}100%{transform:translate(0,0) scale(1)}}
</style>
</helmet>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sb-liquid" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="60" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="sb-liquid-fine" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="14" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.4" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div style="position:relative;width:1240px;max-width:100%;min-height:1400px;overflow:hidden;font-family:'Space Grotesk',sans-serif">

  <!-- FOND vivant réfractable -->
  <div style="position:absolute;inset:-6%;overflow:hidden">
    <div style="position:absolute;width:660px;height:660px;border-radius:50%;background:radial-gradient(circle,#ff7a2e,transparent 60%);top:-6%;left:-4%;filter:blur(20px);animation:ho-drift 18s ease-in-out infinite"></div>
    <div style="position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,#2e7bff,transparent 60%);bottom:-12%;right:-6%;filter:blur(20px);animation:ho-drift2 22s ease-in-out infinite"></div>
    <div style="position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,#c64bff,transparent 62%);top:40%;left:42%;filter:blur(24px);animation:ho-drift 26s ease-in-out infinite reverse"></div>
    <div style="position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#2effc0,transparent 62%);top:60%;left:6%;filter:blur(26px);animation:ho-drift2 30s ease-in-out infinite"></div>
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:52px 52px"></div>
  </div>

  <!-- entête planche -->
  <div style="position:relative;z-index:2;padding:40px 48px 0">
    <div style="display:inline-flex;align-items:center;gap:8px;font:600 12px 'Space Mono',monospace;color:#fff;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.4)"><span style="width:7px;height:7px;border-radius:50%;background:#ff9a3c;box-shadow:0 0 10px #ff9a3c"></span>Handoff · Liquid Glass — Style Board (3a)</div>
  </div>

  <div style="position:relative;z-index:2;display:grid;grid-template-columns:repeat(2,1fr);gap:26px;padding:28px 48px 56px;align-items:start">

    <!-- BOUTONS -->
    <div style="position:relative;padding:28px;border-radius:30px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:30px;-webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.08);backdrop-filter:blur(2px) saturate(180%) brightness(1.08);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.04) 46%,rgba(255,255,255,0) 62%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.28),0 30px 60px -24px rgba(0,0,0,.6)"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:18px">
        <span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Boutons</span>
        <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
          <span style="color:#141414;font-weight:700;font-size:15px;padding:14px 26px;border-radius:30px;background:rgba(255,255,255,.92);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 12px 28px -10px rgba(0,0,0,.5)">Primaire</span>
          <span style="color:#fff;font-weight:600;font-size:15px;padding:14px 24px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)">Verre</span>
          <span style="color:#1a0f04;font-weight:700;font-size:15px;padding:14px 24px;border-radius:30px;background:linear-gradient(135deg,#ffc061,#ff8a1e);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 12px 28px -10px rgba(255,138,30,.6)">Ambre</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
          <span style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)">↓</span>
          <span style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#141414;font-size:20px;background:rgba(255,255,255,.92);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 10px 22px -10px rgba(0,0,0,.5)">▶</span>
          <span style="color:#fff;font-weight:600;font-size:13.5px;padding:11px 18px;border-radius:30px;background:transparent;border:1px solid rgba(255,255,255,.3)">Texte</span>
        </div>
      </div>
    </div>

    <!-- NAV PILL + CHIPS -->
    <div style="position:relative;padding:28px;border-radius:30px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:30px;-webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.08);backdrop-filter:blur(2px) saturate(180%) brightness(1.08);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.04) 46%,rgba(255,255,255,0) 62%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.28),0 30px 60px -24px rgba(0,0,0,.6)"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:18px">
        <span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Nav & chips</span>
        <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:8px;border-radius:40px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)">
          <span style="color:#141414;font-weight:600;font-size:13px;padding:9px 16px;border-radius:30px;background:rgba(255,255,255,.9)">Actif</span>
          <span style="color:rgba(255,255,255,.85);font-weight:500;font-size:13px;padding:9px 14px">Onglet</span>
          <span style="color:rgba(255,255,255,.85);font-weight:500;font-size:13px;padding:9px 14px">Onglet</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <span style="font:600 12px 'Space Mono',monospace;color:#fff;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)">chip</span>
          <span style="font:600 12px 'Space Mono',monospace;color:#fff;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)">chip</span>
          <span style="font:600 12px 'Space Mono',monospace;color:#1a0f04;padding:8px 14px;border-radius:20px;background:linear-gradient(135deg,#ffc061,#ff8a1e)">actif</span>
          <span style="display:inline-flex;align-items:center;gap:7px;font:600 12px 'Space Mono',monospace;color:#fff;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)"><span style="width:7px;height:7px;border-radius:50%;background:#2effc0;box-shadow:0 0 8px #2effc0"></span>live</span>
        </div>
      </div>
    </div>

    <!-- SLIDER + TOGGLE -->
    <div style="position:relative;padding:28px;border-radius:30px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:30px;-webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.08);backdrop-filter:blur(2px) saturate(180%) brightness(1.08);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.04) 46%,rgba(255,255,255,0) 62%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.28),0 30px 60px -24px rgba(0,0,0,.6)"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:26px">
        <span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Slider & toggle</span>
        <div style="position:relative;height:12px;border-radius:8px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)">
          <div style="position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.9))"></div>
          <div style="position:absolute;left:62%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 6px 16px -4px rgba(0,0,0,.6)"></div>
        </div>
        <div style="position:relative;height:12px;border-radius:8px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)">
          <div style="position:absolute;left:0;top:0;bottom:0;width:34%;border-radius:8px;background:linear-gradient(90deg,#ffc061,#ff8a1e)"></div>
          <div style="position:absolute;left:34%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 6px 16px -4px rgba(0,0,0,.6)"></div>
        </div>
        <div style="display:flex;gap:16px;align-items:center">
          <div style="width:58px;height:32px;border-radius:20px;background:linear-gradient(135deg,#ffc061,#ff8a1e);position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)"><div style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div></div>
          <div style="width:58px;height:32px;border-radius:20px;background:rgba(255,255,255,.16);position:relative;border:1px solid rgba(255,255,255,.3)"><div style="position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85)"></div></div>
        </div>
      </div>
    </div>

    <!-- BARRES / PROGRESS -->
    <div style="position:relative;padding:28px;border-radius:30px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:30px;-webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.08);backdrop-filter:blur(2px) saturate(180%) brightness(1.08);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.04) 46%,rgba(255,255,255,0) 62%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.28),0 30px 60px -24px rgba(0,0,0,.6)"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:16px">
        <span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Barres de progression</span>
        <div style="height:8px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden"><div style="width:92%;height:100%;background:linear-gradient(90deg,#ffc061,#ff8a1e)"></div></div>
        <div style="height:8px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden"><div style="width:78%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.95))"></div></div>
        <div style="height:8px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden"><div style="width:100%;height:100%;background:linear-gradient(90deg,#ffc061,#ff8a1e)"></div></div>
        <div style="display:flex;gap:20px;margin-top:6px;align-items:center">
          <div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(#ff8a1e 76%,rgba(255,255,255,.16) 0);display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px;border-radius:50%;background:rgba(20,20,26,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)"></div></div>
          <div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(rgba(255,255,255,.9) 50%,rgba(255,255,255,.16) 0);display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px;border-radius:50%;background:rgba(20,20,26,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)"></div></div>
        </div>
      </div>
    </div>

    <!-- INPUT / SEARCH -->
    <div style="position:relative;padding:28px;border-radius:30px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:30px;-webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.08);backdrop-filter:blur(2px) saturate(180%) brightness(1.08);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.04) 46%,rgba(255,255,255,0) 62%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.28),0 30px 60px -24px rgba(0,0,0,.6)"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:16px">
        <span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Champs</span>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:30px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)">
          <span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6)"></span>
          <div style="flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.28);max-width:180px"></div>
          <span style="color:#141414;font-weight:600;font-size:13px;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.9)">OK</span>
        </div>
        <div style="display:flex;gap:12px">
          <div style="flex:1;height:46px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)"></div>
          <div style="width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#ffc061,#ff8a1e);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)"></div>
        </div>
      </div>
    </div>

    <!-- CARTE VERRE -->
    <div style="position:relative;width:100%;height:246px;border-radius:34px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:34px;-webkit-backdrop-filter:blur(3px) saturate(190%) brightness(1.05);backdrop-filter:blur(3px) saturate(190%) brightness(1.05);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:34px;background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(255,255,255,.03) 46%,rgba(255,255,255,0) 100%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.2),0 40px 80px -26px rgba(0,0,0,.7)"></div>
      <div style="position:absolute;top:0;left:-30%;width:55%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-16deg);opacity:.45"></div>
      <div style="position:relative;z-index:2;height:100%;padding:26px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Carte</span><span style="color:#ff9a3c">●</span></div>
        <div style="display:flex;gap:12px">
          <div style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:9px;justify-content:center">
            <div style="height:9px;width:70%;border-radius:5px;background:rgba(255,255,255,.5)"></div>
            <div style="height:9px;width:45%;border-radius:5px;background:rgba(255,255,255,.28)"></div>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <span style="flex:1;text-align:center;color:#141414;font-weight:600;font-size:13px;padding:10px;border-radius:20px;background:rgba(255,255,255,.9)"> </span>
          <span style="flex:1;text-align:center;color:#fff;font-weight:600;font-size:13px;padding:10px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35)"> </span>
        </div>
      </div>
    </div>

    <!-- SWATCHES palette -->
    <div style="position:relative;grid-column:1 / -1;padding:26px;border-radius:30px;overflow:hidden">
      <div style="position:absolute;inset:0;border-radius:30px;-webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.08);backdrop-filter:blur(2px) saturate(180%) brightness(1.08);filter:url(#sb-liquid)"></div>
      <div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.03) 50%,rgba(255,255,255,0) 62%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.24),0 30px 60px -24px rgba(0,0,0,.6)"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:16px">
        <span style="font:700 10px 'Space Mono',monospace;color:rgba(255,255,255,.7);letter-spacing:.18em;text-transform:uppercase">Palette & matière</span>
        <div style="display:flex;flex-wrap:wrap;gap:14px">
          <div style="width:76px;height:76px;border-radius:18px;background:linear-gradient(135deg,#ffc061,#ff8a1e);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)"></div>
          <div style="width:76px;height:76px;border-radius:18px;background:#ff7a2e"></div>
          <div style="width:76px;height:76px;border-radius:18px;background:#2e7bff"></div>
          <div style="width:76px;height:76px;border-radius:18px;background:#c64bff"></div>
          <div style="width:76px;height:76px;border-radius:18px;background:#2effc0"></div>
          <div style="width:76px;height:76px;border-radius:18px;background:#0e1016;border:1px solid rgba(255,255,255,.2)"></div>
          <div style="width:76px;height:76px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)"></div>
        </div>
      </div>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
